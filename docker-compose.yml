name: momentum-pg

services:
  node:
    image: node:22-alpine
    container_name: tmpg_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    profiles: ["tools"]

  app:
    build: .
    container_name: tmpg_app
    command: php-fpm -d opcache.validate_timestamps=0 -d realpath_cache_size=4096K -d realpath_cache_ttl=600
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    container_name: tmpg_migrate
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  scheduler:
    build: .
    container_name: tmpg_scheduler
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["php", "artisan", "schedule:work"]
    profiles: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: tmpg_nginx
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: tmpg_db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql-import:
    image: mysql:8.0
    container_name: tmpg_mysql_import
    profiles: ["import"]
    command: --skip-name-resolve --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - ./storage/import/backup-mysql.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -prootsecret -N -e 'SELECT COUNT(*) FROM task_manager.users' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  adminer:
    image: adminer:latest
    container_name: tmpg_adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

volumes:
  pgdata: